[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orkio-fintech-backend"
version = "0.1.0"
description = "Greenfield backend for the ORKIO fintech ecosystem."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "sqlalchemy==2.0.50",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "alembic==1.18.4",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "cryptography==46.0.3"
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
