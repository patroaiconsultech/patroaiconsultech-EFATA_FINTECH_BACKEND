services:
  postgres-gate:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fintech_ci
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech_ci_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d fintech_ci"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
