name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run python -m compileall app tests -q
      - run: uv run pytest -q
      - name: Alembic SQLite roundtrip
        env:
          FINTECH_APP_ENV: test
          FINTECH_DATABASE_URL: sqlite:///./migration_ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  postgresql-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fintech_ci
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintech -d fintech_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FINTECH_APP_ENV: test
      FINTECH_DATABASE_URL: postgresql+psycopg://fintech:fintech_ci_only@localhost:5432/fintech_ci
      FINTECH_AUTH_PROVIDER: mock
      RUN_POSTGRES_INTEGRATION: "1"
      FINTECH_POSTGRES_GATE_CONFIRM: I_UNDERSTAND_THIS_DATABASE_WILL_BE_DOWNGRADED
      FINTECH_POSTGRES_GATE_ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - name: PostgreSQL proof gate
        run: |
          uv run python scripts/postgres_gate.py \
            --database-url "$FINTECH_DATABASE_URL" \
            --report postgres_gate_report.json
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-gate-report
          path: postgres_gate_report.json
          if-no-files-found: error
