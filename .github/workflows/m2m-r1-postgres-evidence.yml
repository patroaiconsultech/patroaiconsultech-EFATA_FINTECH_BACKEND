name: EFATA Fintech M2M R1 PostgreSQL Evidence

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type APPROVE_M2M_R1_POSTGRES_EVIDENCE'
        required: true
        type: string

jobs:
  m2m-r1-postgres:
    name: M2M R1 read-only / PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fintech_m2m_ci
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech_m2m_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintech -d fintech_m2m_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      FINTECH_APP_ENV: test
      FINTECH_DATABASE_URL: postgresql+psycopg://fintech:fintech_m2m_ci_only@localhost:5432/fintech_m2m_ci
      FINTECH_AUTH_PROVIDER: mock
      FINTECH_EFATA_MODE: mock
      FINTECH_EFATA_PLATFORM_BRIDGE_ENABLED: "false"
      FINTECH_M2M_ENABLED: "false"
      RUN_POSTGRES_INTEGRATION: "1"

    steps:
      - name: Human approval + controlled branch gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.approval }}" = "APPROVE_M2M_R1_POSTGRES_EVIDENCE"
          test "${GITHUB_REF_NAME}" = "feat/efata-fintech-m2m-r1-read-only"
          echo "human_approval=CONFIRMED"
          echo "branch=${GITHUB_REF_NAME}"
          echo "deploy_authorized=false"
          echo "merge_authorized=false"
          echo "m2m_live_authorized=false"

      - name: Checkout exact selected branch
        uses: actions/checkout@v4

      - name: Record Git provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "git_sha=$(git rev-parse HEAD)"
            echo "git_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
          } | tee evidence/00_git_provenance.log

      - name: Verify exact audited functional source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c ci/m2m-r1-source.sha256 \
            | tee evidence/01_source_integrity.log

      - name: Setup uv / Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Record runtime toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            python --version
            uv --version
          } | tee evidence/02_toolchain.log

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv sync --frozen --extra dev 2>&1 \
            | tee evidence/03_uv_sync.log

      - name: Prove PostgreSQL identity
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY' | tee evidence/04_postgres_identity.log
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["FINTECH_DATABASE_URL"])
          with engine.connect() as connection:
              row = connection.execute(
                  text(
                      "select version(), current_database(), current_user, "
                      "current_setting('server_version_num')"
                  )
              ).one()
              print(f"postgres_version={row[0]}")
              print(f"database={row[1]}")
              print(f"current_user={row[2]}")
              print(f"server_version_num={row[3]}")
          engine.dispose()
          PY

      - name: Confirm M2M defaults fail closed
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY' | tee evidence/05_m2m_default_off.log
          from app.config import get_settings
          get_settings.cache_clear()
          settings = get_settings()
          print(f"m2m_enabled={settings.m2m_enabled}")
          assert settings.m2m_enabled is False
          PY

      - name: Alembic heads before migration
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv run alembic heads 2>&1 | tee evidence/06_alembic_heads.log

      - name: Upgrade clean PostgreSQL to head
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv run alembic upgrade head 2>&1 \
            | tee evidence/07_alembic_upgrade_head.log

      - name: Prove migration head and schema identity
        shell: bash
        run: |
          set -euo pipefail
          {
            uv run alembic current
            uv run alembic check
          } 2>&1 | tee evidence/08_alembic_current_check.log

          uv run python - <<'PY' | tee evidence/09_schema_inventory.log
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["FINTECH_DATABASE_URL"])
          inspector = inspect(engine)
          tables = sorted(inspector.get_table_names())
          with engine.connect() as conn:
              versions = [row[0] for row in conn.execute(text("select version_num from alembic_version"))]
          print(f"alembic_versions={versions}")
          print(f"table_count={len(tables)}")
          print("tables=" + ",".join(tables))
          assert "platform_audit_events" in tables
          engine.dispose()
          PY

      - name: M2M focused tests on PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pytest -vv -rs \
            tests/test_m2m_auth.py \
            tests/test_m2m_tenant_isolation.py \
            tests/test_m2m_read_api.py \
            tests/test_m2m_audit.py \
            tests/test_m2m_contract.py \
            2>&1 | tee evidence/10_m2m_postgres_tests.log

      - name: Explicit PostgreSQL audit persistence proof
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pytest -vv -s --tb=long \
            tests/test_m2m_audit.py::test_successful_m2m_request_persists_structured_audit \
            tests/test_m2m_tenant_isolation.py::test_m2m_scope_denial_is_persisted_only_after_valid_tenant_context \
            2>&1 | tee evidence/11_m2m_audit_postgres_proof.log

      - name: PostgreSQL concurrency regression
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pytest -vv -rs \
            tests/test_postgres_concurrency.py \
            tests/test_postgresql_atomic_concurrency.py \
            2>&1 | tee evidence/12_postgres_concurrency.log

      - name: Full backend regression on PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pytest -q -rs 2>&1 \
            | tee evidence/13_full_postgres_regression.log

      - name: Final migration state
        shell: bash
        run: |
          set -euo pipefail
          {
            uv run alembic current
            uv run alembic check
          } 2>&1 | tee evidence/14_final_migration_state.log

      - name: Write PASS summary
        if: success()
        shell: bash
        run: |
          cat > evidence/GATE_RESULT.txt <<EOF
          gate=M2M_R1_POSTGRES_EVIDENCE
          source_integrity=PASS
          postgres_runtime=PASS
          alembic_upgrade_head=PASS
          m2m_postgres_tests=PASS
          m2m_audit_persistence=PASS
          postgres_concurrency=PASS
          full_postgres_regression=PASS
          alembic_check=PASS
          migration_downgrade_base=NOT_EXECUTED_KNOWN_MIG0009_SEPARATE_GATE
          real_efata_introspection=NOT_EXECUTED
          m2m_live=NOT_ENABLED
          merge_executed=false
          deploy_executed=false
          production_authorized=false
          EOF

      - name: Write FAIL summary
        if: failure()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/GATE_RESULT.txt <<EOF
          gate=M2M_R1_POSTGRES_EVIDENCE
          final_status=FAIL
          inspect_first_failing_step=true
          source_patch_authorized=false
          merge_executed=false
          deploy_executed=false
          m2m_live=false
          production_authorized=false
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efata-fintech-m2m-r1-postgres-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
