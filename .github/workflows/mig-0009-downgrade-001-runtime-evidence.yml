name: mig-0009-downgrade-001-runtime-evidence

on:
  workflow_dispatch:
    inputs:
      migration_test_approval:
        description: 'Type APPROVE_MIG_0009_DOWNGRADE_001_EPHEMERAL_POSTGRES_TEST_EXECUTION'
        required: true
        type: string

jobs:
  mig-0009-runtime-evidence:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fintech_ci
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintech -d fintech_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      BASELINE_SHA: 045c7e4c7a124f1b69351916ec1c42c014cc9d68
      FINTECH_APP_ENV: test
      FINTECH_DATABASE_URL: postgresql+psycopg://fintech:fintech_ci_only@localhost:5432/fintech_ci
      FINTECH_AUTH_PROVIDER: mock
      FINTECH_EFATA_MODE: mock
      FINTECH_EFATA_PLATFORM_BRIDGE_ENABLED: "false"

    steps:
      - name: Human migration-test approval gate
        shell: bash
        run: |
          test "${{ inputs.migration_test_approval }}" = "APPROVE_MIG_0009_DOWNGRADE_001_EPHEMERAL_POSTGRES_TEST_EXECUTION"
          echo "human_approval=CONFIRMED_FOR_EPHEMERAL_POSTGRES_CI_ONLY"

      - name: Checkout exact baseline commit
        uses: actions/checkout@v4
        with:
          ref: 045c7e4c7a124f1b69351916ec1c42c014cc9d68

      - name: Confirm baseline SHA
        shell: bash
        run: |
          echo "EXPECTED_BASELINE_SHA=$BASELINE_SHA"
          echo "ACTUAL_BASELINE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"

      - name: Overlay exact AO-01 approved MIG-0009-DOWNGRADE-001 proposal
        shell: bash
        run: |
          mkdir -p migrations/versions tests
          printf '%s' '' | base64 -d > migrations/versions/0009_sync_job_study_link_r11.py
          printf '%s' '' | base64 -d > tests/test_migration_0009_downgrade_postgres.py
          echo "proposal_overlay_applied=true"
          echo "functional_commit_created=false"

      - name: Verify exact proposal hashes
        shell: bash
        run: |
          echo "2b874efc6f3492a4d0e81278ecd3c4c7e4cfd0b2074f3294ae23e949e1bf2a51  migrations/versions/0009_sync_job_study_link_r11.py" | sha256sum -c -
          echo "a9bf77575447665cde6d05ddd26bcdd3818779b5bce2a05cab24d659afd98d61  tests/test_migration_0009_downgrade_postgres.py" | sha256sum -c -

      - name: Verify scope is exactly two files
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"

          changed="$(printf '%s\n' "$status" | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            migrations/versions/0009_sync_job_study_link_r11.py \
            tests/test_migration_0009_downgrade_postgres.py | sort)"

          if [ "$changed" != "$expected" ]; then
            echo "ERROR: worktree scope differs from approved two-file overlay"
            echo "--- expected ---"
            printf '%s\n' "$expected"
            echo "--- actual ---"
            printf '%s\n' "$changed"
            exit 1
          fi

          # Persist evidence only after the scope assertion passes, so the
          # evidence file cannot contaminate the assertion itself.
          printf '%s\n' "$status" > evidence_00_git_status.log
          echo "scope_guard=PASS"

      - name: Setup uv / Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - name: Prove PostgreSQL runtime
        shell: bash
        run: |
          set -o pipefail
          uv run python - <<'PY' | tee evidence_01_postgres_runtime.log
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["FINTECH_DATABASE_URL"])
          with engine.connect() as c:
              row = c.execute(text(
                  "select version(), current_database(), current_user, "
                  "current_setting('server_version_num')"
              )).one()
              print(f"postgres_version={row[0]}")
              print(f"database={row[1]}")
              print(f"current_user={row[2]}")
              print(f"server_version_num={row[3]}")
          engine.dispose()
          PY

      - name: MIG-0009 specific PostgreSQL migration proof
        shell: bash
        env:
          RUN_POSTGRES_MIGRATION_TESTS: "1"
        run: |
          set -o pipefail
          uv run pytest --noconftest -vv -x --tb=long -s \
            tests/test_migration_0009_downgrade_postgres.py \
            2>&1 | tee evidence_02_mig0009_specific.log

      - name: PG_FIX_006 PostgreSQL migration proof
        shell: bash
        env:
          RUN_POSTGRES_MIGRATION_TESTS: "1"
        run: |
          set -o pipefail
          uv run pytest --noconftest -vv -x --tb=long -s \
            tests/test_audit_resource_id_migration_postgres_pgfix006.py \
            2>&1 | tee evidence_03_pgfix006_migration.log

      - name: Full PostgreSQL proof gate
        shell: bash
        env:
          RUN_POSTGRES_INTEGRATION: "1"
          FINTECH_POSTGRES_GATE_CONFIRM: I_UNDERSTAND_THIS_DATABASE_WILL_BE_DOWNGRADED
          FINTECH_POSTGRES_GATE_ALLOWED_HOSTS: localhost
        run: |
          set -o pipefail
          uv run python scripts/postgres_gate.py \
            2>&1 | tee evidence_04_postgres_gate_console.log

      - name: Final Alembic check
        if: success()
        shell: bash
        run: |
          set -o pipefail
          uv run alembic check 2>&1 | tee evidence_05_alembic_check.log

      - name: Write evidence manifest
        if: always()
        shell: bash
        run: |
          cat > mig_0009_runtime_evidence_manifest.txt <<EOF
          incident=MIG-0009-DOWNGRADE-001
          baseline_sha=$BASELINE_SHA
          migration_file_sha256=2b874efc6f3492a4d0e81278ecd3c4c7e4cfd0b2074f3294ae23e949e1bf2a51
          test_file_sha256=a9bf77575447665cde6d05ddd26bcdd3818779b5bce2a05cab24d659afd98d61
          proposal_zip_sha256=fd49fc2dcfdfd814c6df6e7ccde664af8af5ecdb557ade56382585f08cd025df
          functional_commit_created=false
          production_migration_executed=false
          production_deploy_executed=false
          EOF

      - name: Upload complete runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mig-0009-downgrade-001-runtime-evidence
          path: |
            evidence_*.log
            postgres_gate_report.json
            mig_0009_runtime_evidence_manifest.txt
          if-no-files-found: warn
