name: pg-fix-006-r2-runtime-evidence

on:
  workflow_dispatch:
    inputs:
      migration_approval:
        description: 'Type APPROVE_PG_FIX_006_R2_MIGRATION_TEST_EXECUTION'
        required: true
        type: string

jobs:
  pg-fix-006-r2-evidence:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fintech_ci
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintech -d fintech_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      BASELINE_SHA: 089dfc42842c48a0129643b238b829a65c94fac6
      FINTECH_APP_ENV: test
      FINTECH_DATABASE_URL: postgresql+psycopg://fintech:fintech_ci_only@localhost:5432/fintech_ci
      FINTECH_AUTH_PROVIDER: mock
      FINTECH_EFATA_MODE: mock
      FINTECH_EFATA_PLATFORM_BRIDGE_ENABLED: "false"

    steps:
      - name: Human migration approval gate
        shell: bash
        run: |
          test "${{ inputs.migration_approval }}" = "APPROVE_PG_FIX_006_R2_MIGRATION_TEST_EXECUTION"
          echo "human_migration_approval=CONFIRMED_FOR_EPHEMERAL_POSTGRES_TEST_ONLY"

      - name: Checkout exact failing baseline commit
        uses: actions/checkout@v4
        with:
          ref: 089dfc42842c48a0129643b238b829a65c94fac6

      - name: Confirm baseline SHA
        shell: bash
        run: |
          echo "EXPECTED_BASELINE_SHA=$BASELINE_SHA"
          echo "ACTUAL_BASELINE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"

      - name: Overlay exact AO-01 approved PG_FIX_006 R2 proposal in working tree
        shell: bash
        run: |
          cat > /tmp/pg_fix_006_r2_payload.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/pg_fix_006_r2_payload.b64 > /tmp/pg_fix_006_r2.tar.gz
          echo "7938c2c1a668fb3d3f84e32ca535b673608b5268bc4a403c07d57b3436ff7ef8  /tmp/pg_fix_006_r2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pg_fix_006_r2.tar.gz -C .
          echo "functional_commit_created=false"
          echo "proposal_overlay_applied_to_worktree=true"

      - name: Verify exact proposed file hashes
        shell: bash
        run: |
          echo "4fe3069f70dc73602b5f4bdf852a1c82cd40afcac257f6741bb3681595d2bd0b  app/models.py" | sha256sum -c -\n          echo "7fda5c40427dd378913a89d8501575576192fa9721560f64e339729ce79d9feb  migrations/versions/0010_audit_resource_id_r11.py" | sha256sum -c -\n          echo "65cf7665353d1d5f501ea51729ef5f84e9be823fce70901a539dc846529ed9c9  tests/test_audit_resource_id_contract_pgfix006.py" | sha256sum -c -\n          echo "6e0393346d5c56734d1488fee8702942f6eb0a06aa92b0c4d4306de0de4298d1  tests/test_audit_resource_id_migration_postgres_pgfix006.py" | sha256sum -c -\n

      - name: Setup uv / Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - name: Prove PostgreSQL runtime
        shell: bash
        run: |
          uv run python - <<'PY' | tee evidence_00_postgres_runtime.log
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["FINTECH_DATABASE_URL"])
          with engine.connect() as connection:
              row = connection.execute(
                  text(
                      "select version(), current_database(), current_user, "
                      "current_setting('server_version_num')"
                  )
              ).one()
              print(f"postgres_version={row[0]}")
              print(f"database={row[1]}")
              print(f"current_user={row[2]}")
              print(f"server_version_num={row[3]}")
          engine.dispose()
          PY

      - name: Migration proof — legacy 36 to 255 / rollback / drift guards
        shell: bash
        env:
          RUN_POSTGRES_MIGRATION_TESTS: "1"
        run: |
          set -o pipefail
          uv run pytest -vv -x --tb=long -s             tests/test_audit_resource_id_migration_postgres_pgfix006.py             2>&1 | tee evidence_01_migration_proof.log

      - name: Prepare functional fintech_ci at Alembic head
        shell: bash
        run: |
          set -o pipefail
          uv run alembic upgrade head 2>&1 | tee evidence_02_upgrade_head.log
          uv run python - <<'PY' | tee evidence_03_schema_contract.log
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ["FINTECH_DATABASE_URL"])
          with engine.connect() as connection:
              col = next(
                  c for c in inspect(connection).get_columns("platform_audit_events")
                  if c["name"] == "resource_id"
              )
              print(f"platform_audit_events.resource_id.length={col['type'].length}")
              assert int(col["type"].length) == 255
          engine.dispose()
          PY

      - name: Targeted settlement regression
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -vv -x --tb=long -s             tests/test_reconciliation_persistent_api.py::test_operator_can_manage_review_queue_and_outbox             2>&1 | tee evidence_04_targeted_settlement.log

      - name: PostgreSQL concurrency
        shell: bash
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: |
          set -o pipefail
          uv run pytest -vv -x --tb=long -s             tests/test_postgres_concurrency.py             tests/test_postgresql_atomic_concurrency.py             2>&1 | tee evidence_05_concurrency.log

      - name: Full backend suite on PostgreSQL
        shell: bash
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: |
          set -o pipefail
          uv run pytest -vv --tb=long             2>&1 | tee evidence_06_full_backend_postgres.log

      - name: Recreate clean fintech_ci for fresh-db gate
        shell: bash
        run: |
          uv run python - <<'PY' | tee evidence_07_fresh_db_recreate.log
          from sqlalchemy import create_engine
          admin = create_engine(
              "postgresql+psycopg://fintech:fintech_ci_only@localhost:5432/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with admin.connect() as c:
              c.exec_driver_sql("DROP DATABASE IF EXISTS fintech_ci WITH (FORCE)")
              c.exec_driver_sql("CREATE DATABASE fintech_ci")
          admin.dispose()
          print("fresh_database=fintech_ci")
          PY

      - name: Fresh DB PostgreSQL proof gate
        shell: bash
        env:
          RUN_POSTGRES_INTEGRATION: "1"
          FINTECH_POSTGRES_GATE_CONFIRM: I_UNDERSTAND_THIS_DATABASE_WILL_BE_DOWNGRADED
          FINTECH_POSTGRES_GATE_ALLOWED_HOSTS: localhost
        run: |
          set -o pipefail
          uv run python scripts/postgres_gate.py             2>&1 | tee evidence_08_postgres_gate_console.log

      - name: Final Alembic check and schema contract
        if: success()
        shell: bash
        run: |
          set -o pipefail
          uv run alembic check 2>&1 | tee evidence_09_alembic_check.log
          uv run python - <<'PY' | tee evidence_10_final_schema.log
          import os
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine(os.environ["FINTECH_DATABASE_URL"])
          with engine.connect() as c:
              col = next(
                  x for x in inspect(c).get_columns("platform_audit_events")
                  if x["name"] == "resource_id"
              )
              revision = c.execute(text("select version_num from alembic_version")).scalar_one()
              print(f"alembic_revision={revision}")
              print(f"resource_id_length={col['type'].length}")
              assert int(col["type"].length) == 255
          engine.dispose()
          PY

      - name: Write evidence manifest
        if: always()
        shell: bash
        run: |
          cat > pg_fix_006_r2_runtime_evidence_manifest.txt <<EOF
          proposal=PG_FIX_006_R2
          baseline_sha=$BASELINE_SHA
          functional_commit_created=false
          migration_environment=ephemeral_postgresql_17
          production_migration_executed=false
          production_deploy_executed=false
          proposal_payload_sha256=7938c2c1a668fb3d3f84e32ca535b673608b5268bc4a403c07d57b3436ff7ef8
          EOF
          git status --short >> pg_fix_006_r2_runtime_evidence_manifest.txt || true

      - name: Upload complete runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-fix-006-r2-runtime-evidence
          path: |
            evidence_*.log
            postgres_gate_report.json
            pg_fix_006_r2_runtime_evidence_manifest.txt
          if-no-files-found: warn
